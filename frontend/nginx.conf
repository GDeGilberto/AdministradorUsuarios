server {
    listen 80;
    absolute_redirect off;
    
    location / {
        root /usr/share/nginx/html;
        index index.csr.html index.html;
        try_files $uri $uri/ /index.csr.html;
    }

    # Redirigir peticiones de API al contenedor backend de Docker de forma dinámica
    location ^~ /api/ {
        resolver 127.0.0.11 valid=5s;
        set $upstream_backend http://backend:8080;
        proxy_pass $upstream_backend$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'keep-alive';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Redirigir /swagger a /swagger/ (con barra inclinada) para evitar problemas con rutas de assets relativos
    location = /swagger {
        return 301 $scheme://$http_host/swagger/;
    }

    # Exponer la documentación de Swagger públicamente de forma dinámica
    location ^~ /swagger/ {
        resolver 127.0.0.11 valid=5s;
        set $upstream_backend http://backend:8080;
        proxy_pass $upstream_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
