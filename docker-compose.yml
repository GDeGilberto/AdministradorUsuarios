services:
  # 1. Base de datos SQL Server contenida
  database:
    container_name: administradorUsuarios-database
    image: mcr.microsoft.com/azure-sql-edge:latest
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${DB_PASSWORD}
    ports:
      - "${DB_PORT}:1433"

  # 2. Tu API de .NET
  backend:
    container_name: administradorUsuarios-backend
    build: ./backend
    ports:
      - "${BACKEND_PORT}:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENV}
      # Construcción dinámica de la cadena de conexión por variables de entorno
      - ConnectionStrings__DefaultConnection=Server=${DB_SERVER};Database=${DB_NAME};User Id=${DB_USER};Password=${DB_PASSWORD};Encrypt=False;
      # Clave secreta del JWT inyectada dinámicamente
      - JwtSettings__SecretKey=${JWT_SECRET_KEY}
    depends_on:
      - database

  # 3. Tu aplicación Angular
  frontend:
    container_name: administradorUsuarios-frontend
    build: ./frontend
    ports:
      - "${FRONTEND_PORT}:80"
    depends_on:
      - backend
