services:
  # 1. Base de datos PostgreSQL
  database:
    container_name: administradorUsuarios-database
    image: postgres:16-alpine
    restart: always
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    ports:
      - "${DB_PORT}:${DB_INTERNAL_PORT}"
    volumes:
      - pg_data:/var/lib/postgresql/data


  # 2. Tu API de .NET
  backend:
    container_name: administradorUsuarios-backend
    build: ./backend
    restart: always
    ports:
      - "${BACKEND_PORT}:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENV}
      # Construcción dinámica de la cadena de conexión por variables de entorno
      - ConnectionStrings__DefaultConnection=Host=${DB_SERVER};Port=${DB_INTERNAL_PORT};Database=${DB_NAME};Username=${DB_USER};Password=${DB_PASSWORD};
      # Clave secreta del JWT inyectada dinámicamente
      - JwtSettings__SecretKey=${JWT_SECRET_KEY}
    depends_on:
      - database

  # 3. Tu aplicación Angular
  frontend:
    container_name: administradorUsuarios-frontend
    build: ./frontend
    restart: always
    ports:
      - "${FRONTEND_PORT}:80"
    depends_on:
      - backend

volumes:
  pg_data:

